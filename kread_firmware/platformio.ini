; PlatformIO Configuration for kread firmware
; Target: Xteink X4 (ESP32-C3)

[env:esp32c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = espidf

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
upload_port = COM7
monitor_port = COM7

; Build flags
build_flags =
    -DCONFIG_LOG_DEFAULT_LEVEL=3
    -DKREAD_VERSION=\"0.1.0\"
    -I include
    -Wno-address

; Partition table - CrossPoint compatible (OTA)
board_build.partitions = partitions.csv

; x4 SDK auto-discovered from lib/x4/
